<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillPulse — AI Job Matching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
:root{
  --navy:#0B1220; --navy2:#111A2E; --navy3:#182645;
  --teal:#14B8A6; --teal-l:#5EEAD4; --amber:#F59E0B; --coral:#FB7185;
  --bg:#F4F6FA; --card:#FFFFFF; --text:#1B2537; --muted:#6B7690; --border:#E4E9F2;
}
*{box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
h1,h2,h3,h4,h5,.brand,.display-font{font-family:'Sora',sans-serif;}
.brand{font-weight:800;letter-spacing:-.02em;}
.brand .pulse-dot{color:var(--teal);}
a{text-decoration:none;}

/* ---------- Auth screen ---------- */
.auth-wrap{min-height:100vh;display:flex;}
.auth-hero{background:radial-gradient(120% 120% at 10% 0%, #16243F 0%, var(--navy) 60%);color:#fff;flex:1.1;display:flex;flex-direction:column;justify-content:center;padding:5vw;position:relative;overflow:hidden;}
.auth-hero h1{font-size:2.6rem;font-weight:800;line-height:1.15;}
.auth-hero p{color:#A9B4CC;font-size:1.05rem;max-width:460px;}
.pulse-line{width:100%;max-width:460px;margin-top:2.2rem;}
.pulse-line path{fill:none;stroke:var(--teal-l);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.pulse-line circle{fill:var(--teal-l);}
.hero-stats{display:flex;gap:2.2rem;margin-top:2.5rem;}
.hero-stats .num{font-family:'Sora';font-weight:800;font-size:1.6rem;color:var(--teal-l);}
.hero-stats .lbl{color:#8A96B3;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;}
.auth-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg);}
.auth-card{width:100%;max-width:420px;}
.role-toggle{display:flex;background:#EAEEF6;border-radius:12px;padding:4px;margin-bottom:1.4rem;}
.role-toggle button{flex:1;border:none;background:transparent;padding:.55rem;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--muted);transition:.15s;}
.role-toggle button.active{background:var(--navy);color:#fff;}
.mode-tabs{display:flex;gap:1.4rem;margin-bottom:1.2rem;border-bottom:1px solid var(--border);}
.mode-tabs button{border:none;background:none;padding:.5rem 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
.mode-tabs button.active{color:var(--navy);border-color:var(--teal);}
.demo-hint{font-size:.78rem;color:var(--muted);background:#EFF7F5;border:1px dashed #BFE6DF;padding:.55rem .7rem;border-radius:8px;}

/* ---------- App shell ---------- */
.navbar-sp{background:var(--navy);}
.navbar-sp .nav-link{color:#B7C1DA;font-weight:500;font-size:.92rem;}
.navbar-sp .nav-link.active{color:#fff;position:relative;}
.navbar-sp .nav-link.active::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:2px;background:var(--teal);}
.avatar-chip{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#062;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Sora';color:#04332C;}
.page-wrap{padding:2rem 0 4rem;}
.section-title{font-weight:700;font-size:1.3rem;}
.text-muted-2{color:var(--muted)!important;}

/* ---------- cards ---------- */
.card-sp{background:var(--card);border:1px solid var(--border);border-radius:16px;transition:.15s;}
.card-sp:hover{box-shadow:0 8px 24px rgba(20,30,60,.08);transform:translateY(-2px);}
.job-card .job-type-badge{font-size:.7rem;letter-spacing:.03em;}
.skill-chip{display:inline-block;background:#EEF2FF;color:#3B4CB8;border-radius:20px;padding:.22rem .65rem;font-size:.76rem;font-weight:600;margin:2px 3px 2px 0;}
.skill-chip.match{background:#E4F8F2;color:#0E9C7B;}
.skill-chip.gap{background:#FDECEC;color:#D6455B;}
.skill-chip.outline{background:#fff;border:1px solid var(--border);color:var(--muted);}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.3rem;}
.stat-box .num{font-family:'Sora';font-weight:800;font-size:1.7rem;}
.status-badge{font-size:.72rem;padding:.3rem .6rem;border-radius:20px;font-weight:700;letter-spacing:.02em;}
.status-Applied{background:#EAF1FF;color:#2C63C7;}
.status-Shortlisted{background:#FFF4DE;color:#B8730B;}
.status-Hired{background:#E4F8F2;color:#0E9C7B;}
.status-Rejected{background:#FDECEC;color:#D6455B;}

/* match gauge */
.gauge{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
.gauge .inner{width:86px;height:86px;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge .inner .val{font-family:'Sora';font-weight:800;font-size:1.35rem;}
.gauge .inner .sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.gauge-sm{width:56px;height:56px;}
.gauge-sm .inner{width:44px;height:44px;}
.gauge-sm .inner .val{font-size:.8rem;}

/* skill tag input */
.tag-input-box{border:1px solid var(--border);border-radius:10px;padding:.5rem;background:#fff;min-height:48px;}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#04332C;font-weight:600;}
.btn-teal:hover{background:#0FA595;border-color:#0FA595;color:#04332C;}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}
.btn-navy:hover{background:#182645;border-color:#182645;color:#fff;}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted);}
.ai-badge{font-size:.68rem;background:#EFE8FF;color:#6B3FD6;padding:.15rem .5rem;border-radius:20px;font-weight:700;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:10px;}
.form-control:focus,.form-select:focus{border-color:var(--teal);box-shadow:0 0 0 .2rem rgba(20,184,166,.15);}
.toast-sp{position:fixed;top:1rem;right:1rem;z-index:2000;}
</style>
</head>
<body>
  <script src="//code.tidio.co/qepcnynbtlwwdpktqwqvykoaj9jwn4q5.js" async></script>
<div id="app"></div>

<div class="modal fade" id="jobModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content" id="jobModalContent"></div>
  </div>
</div>

<div class="toast-sp" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================= STORAGE ============================= */
const K_USERS='sp_users', K_SESSION='sp_session', K_JOBS='sp_jobs', K_APPS='sp_apps', K_GROQ='sp_groq_key';
const uid=()=>Math.random().toString(36).slice(2,10);
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v===null?d:v;}catch(e){return d;}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

function seed(){
  if(!localStorage.getItem(K_USERS)){
    const users=[
      {id:'p1',role:'poster',name:'Ananya Rao',company:'NimbusTech Labs',email:'poster@demo.com',password:'demo123'},
      {id:'p2',role:'poster',name:'Karan Mehta',company:'Bluewave Analytics',email:'poster2@demo.com',password:'demo123'},
      {id:'c1',role:'candidate',name:'Rahul Verma',email:'candidate@demo.com',password:'demo123',
        skills:['JavaScript','React','CSS','HTML','Git'],bio:'Frontend developer who loves building clean UIs.'},
    ];
    save(K_USERS,users);
  }
  if(!localStorage.getItem(K_JOBS)){
    const jobs=[
      {id:'j1',posterId:'p1',title:'Frontend Developer',company:'NimbusTech Labs',location:'Bengaluru, IN',type:'Full-time',
       salary:'₹8–12 LPA',skillsRequired:['React','JavaScript','CSS','HTML','Git'],
       description:'We are looking for a Frontend Developer to build responsive, delightful interfaces for our SaaS dashboard. You will work closely with designers and backend engineers to ship features fast.',postedDate:Date.now()-86400000*5},
      {id:'j2',posterId:'p1',title:'Backend Developer (Node.js)',company:'NimbusTech Labs',location:'Remote',type:'Full-time',
       salary:'₹10–15 LPA',skillsRequired:['Node.js','Express','MongoDB','REST APIs','Docker'],
       description:'Build and scale backend services powering our analytics platform. Experience with microservices and cloud deployment preferred.',postedDate:Date.now()-86400000*3},
      {id:'j3',posterId:'p2',title:'Data Analyst',company:'Bluewave Analytics',location:'Chennai, IN',type:'Full-time',
       salary:'₹6–9 LPA',skillsRequired:['Python','SQL','Excel','Power BI','Statistics'],
       description:'Analyze large datasets to generate business insights, build dashboards and support data-driven decisions across teams.',postedDate:Date.now()-86400000*8},
      {id:'j4',posterId:'p2',title:'UI/UX Designer',company:'Bluewave Analytics',location:'Hybrid — Chennai',type:'Contract',
       salary:'₹40k–60k /mo',skillsRequired:['Figma','Wireframing','User Research','Prototyping'],
       description:'Design intuitive, accessible experiences for our web and mobile products, from research through high-fidelity prototypes.',postedDate:Date.now()-86400000*1},
      {id:'j5',posterId:'p1',title:'DevOps Engineer',company:'NimbusTech Labs',location:'Remote',type:'Full-time',
       salary:'₹14–18 LPA',skillsRequired:['AWS','Docker','Kubernetes','CI/CD','Linux'],
       description:'Own our cloud infrastructure and deployment pipelines. You will improve reliability, observability and release velocity.',postedDate:Date.now()-86400000*2},
    ];
    save(K_JOBS,jobs);
  }
  if(!localStorage.getItem(K_APPS)) save(K_APPS,[]);
}
seed();

/* ============================= STATE ============================= */
let state={
  view:'auth', authRole:'candidate', authMode:'login',
  tab:'browse', // candidate: browse|applications|profile   poster: postjob|myjobs|applicants
  search:'', filterType:'', filterSkill:'',
  draftSkills:[], // used for signup / profile / postjob tag inputs
  editingJobId:null,
  activeJobForApplicants:null,
};

function currentUser(){
  const s=load(K_SESSION,null); if(!s) return null;
  return load(K_USERS,[]).find(u=>u.id===s.id)||null;
}
function setSession(u){save(K_SESSION,{id:u.id});}
function logout(){localStorage.removeItem(K_SESSION);state.view='auth';state.tab='browse';render();}

function toast(msg,type='success'){
  const id='t'+uid();
  document.getElementById('toastBox').insertAdjacentHTML('beforeend',
    `<div id="${id}" class="toast align-items-center text-bg-${type==='success'?'dark':'danger'} border-0 mb-2" role="alert">
      <div class="d-flex"><div class="toast-body">${msg}</div>
      <button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>`);
  const el=document.getElementById(id);
  const t=new bootstrap.Toast(el,{delay:2600});t.show();
  el.addEventListener('hidden.bs.toast',()=>el.remove());
}

/* ============================= AI MATCHING ============================= */
function fallbackMatch(candidateSkills, job){
  const cs=(candidateSkills||[]).map(s=>s.toLowerCase().trim());
  const req=job.skillsRequired||[];
  const matching=req.filter(s=>cs.includes(s.toLowerCase().trim()));
  const missing=req.filter(s=>!cs.includes(s.toLowerCase().trim()));
  const score=req.length?Math.round((matching.length/req.length)*100):0;
  const recommendation= missing.length===0
    ? `Strong fit — you already cover every required skill for ${job.title}. Highlight relevant project experience in your application.`
    : `You match ${matching.length} of ${req.length} required skills for ${job.title}. Focus on building experience in ${missing.slice(0,3).join(', ')} to boost your candidacy.`;
  return {matchScore:score,matchingSkills:matching,missingSkills:missing,recommendation,source:'local'};
}

async function aiMatch(candidateSkills, job){
  const apiKey=localStorage.getItem(K_GROQ);
  const fb=fallbackMatch(candidateSkills,job);
  if(!apiKey) return fb;
  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({
        model:'llama-3.1-8b-instant',
        temperature:0.3,
        max_tokens:450,
        messages:[
          {role:'system',content:'You are a JSON-only API for candidate-job skill matching in a hiring app. Reply with ONLY a single valid JSON object, no markdown fences, no commentary.'},
          {role:'user',content:`Candidate skills: ${(candidateSkills||[]).join(', ')||'none listed'}.
Job title: ${job.title}.
Required skills: ${(job.skillsRequired||[]).join(', ')}.
Job description: ${job.description}.
Return JSON exactly shaped like: {"matchScore": <integer 0-100>, "matchingSkills": ["..."], "missingSkills": ["..."], "recommendation": "<2-3 sentence, specific, encouraging advice for this candidate about this job>"}`}
        ]
      })
    });
    if(!res.ok) throw new Error('status '+res.status);
    const data=await res.json();
    let text=(data.choices?.[0]?.message?.content||'').trim().replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(text);
    if(typeof parsed.matchScore!=='number') throw new Error('bad shape');
    return {matchScore:Math.max(0,Math.min(100,Math.round(parsed.matchScore))),
      matchingSkills:parsed.matchingSkills||fb.matchingSkills,
      missingSkills:parsed.missingSkills||fb.missingSkills,
      recommendation:parsed.recommendation||fb.recommendation,
      source:'ai'};
  }catch(e){
    console.warn('Groq API failed, using local match instead:',e);
    return {...fb, source:'local-fallback'};
  }
}

function gaugeColor(score){ return score>=75?'#14B8A6':score>=50?'#F59E0B':'#FB7185'; }
function gaugeHtml(score,size='lg'){
  const c=gaugeColor(score);
  const cls=size==='sm'?'gauge gauge-sm':'gauge';
  return `<div class="${cls}" style="background:conic-gradient(${c} ${score*3.6}deg,#E7ECF5 0deg)">
    <div class="inner"><div class="val" style="color:${c}">${score}%</div>${size==='sm'?'':'<div class="sub">Match</div>'}</div></div>`;
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const u=currentUser();
  if(!u){state.view='auth';}
  const app=document.getElementById('app');
  if(state.view==='auth'){ app.innerHTML=renderAuth(); attachAuthEvents(); return; }
  app.innerHTML = renderShell(u);
  attachShellEvents(u);
}

/* ============================= AUTH VIEW ============================= */
function pulseSvg(){
  return `<svg class="pulse-line" viewBox="0 0 460 90"><path d="M0 45 L70 45 L95 10 L120 80 L150 25 L175 45 L460 45"/>
  <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" path="M0 45 L70 45 L95 10 L120 80 L150 25 L175 45 L460 45"/></circle></svg>`;
}
function renderAuth(){
  const role=state.authRole, mode=state.authMode;
  return `
  <div class="auth-wrap">
    <div class="auth-hero d-none d-md-flex">
      <div class="brand fs-3 mb-2">Skill<span class="pulse-dot">Pulse</span></div>
      <h1>Find the role your skills were built for.</h1>
      <p>AI-scored matches, real skill-gap insights, and a dashboard for both sides of the hire.</p>
      ${pulseSvg()}
      <div class="hero-stats">
        <div><div class="num">${load(K_JOBS,[]).length}</div><div class="lbl">Open roles</div></div>
        <div><div class="num">${load(K_USERS,[]).filter(u=>u.role==='candidate').length}</div><div class="lbl">Candidates</div></div>
        <div><div class="num">AI</div><div class="lbl">Match engine</div></div>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-card">
        <div class="d-md-none brand fs-3 mb-3 text-center">Skill<span class="pulse-dot">Pulse</span></div>
        <div class="role-toggle">
          <button data-role="candidate" class="${role==='candidate'?'active':''}"><i class="bi bi-person-workspace me-1"></i>Candidate</button>
          <button data-role="poster" class="${role==='poster'?'active':''}"><i class="bi bi-briefcase me-1"></i>Job Poster</button>
        </div>
        <div class="mode-tabs">
          <button data-mode="login" class="${mode==='login'?'active':''}">Log in</button>
          <button data-mode="signup" class="${mode==='signup'?'active':''}">Sign up</button>
        </div>
        <div id="authFormBox">${mode==='login'?loginForm(role):signupForm(role)}</div>
        <div class="demo-hint mt-3">
          <i class="bi bi-info-circle me-1"></i>Demo login — ${role==='candidate'?'candidate@demo.com':'poster@demo.com'} / demo123
        </div>
      </div>
    </div>
  </div>`;
}
function loginForm(role){
  return `<form id="loginForm">
    <div class="mb-3"><label class="form-label small fw-semibold">Email</label>
      <input type="email" class="form-control" id="loginEmail" required placeholder="you@example.com"></div>
    <div class="mb-3"><label class="form-label small fw-semibold">Password</label>
      <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••"></div>
    <button class="btn ${role==='candidate'?'btn-teal':'btn-navy'} w-100 py-2 fw-semibold">Log in as ${role==='candidate'?'Candidate':'Job Poster'}</button>
  </form>`;
}
function signupForm(role){
  return `<form id="signupForm">
    <div class="mb-3"><label class="form-label small fw-semibold">Full name</label>
      <input class="form-control" id="suName" required placeholder="Jane Doe"></div>
    ${role==='poster'?`<div class="mb-3"><label class="form-label small fw-semibold">Company name</label>
      <input class="form-control" id="suCompany" required placeholder="Acme Inc."></div>`:''}
    <div class="mb-3"><label class="form-label small fw-semibold">Email</label>
      <input type="email" class="form-control" id="suEmail" required placeholder="you@example.com"></div>
    <div class="mb-3"><label class="form-label small fw-semibold">Password</label>
      <input type="password" class="form-control" id="suPassword" required placeholder="Create a password"></div>
    ${role==='candidate'?`<div class="mb-3"><label class="form-label small fw-semibold">Your skills</label>
      ${tagInputHtml('suSkills',state.draftSkills)}</div>`:''}
    <button class="btn ${role==='candidate'?'btn-teal':'btn-navy'} w-100 py-2 fw-semibold">Create account</button>
  </form>`;
}
function tagInputHtml(id,arr){
  return `<div class="tag-input-box">
    <div class="mb-1">${(arr||[]).map((s,i)=>`<span class="skill-chip">${s} <i class="bi bi-x-circle ms-1" style="cursor:pointer" onclick="removeDraftSkill(${i})"></i></span>`).join('')}</div>
    <div class="input-group input-group-sm">
      <input type="text" class="form-control" id="${id}Input" placeholder="Type a skill and press Enter (e.g. React)">
      <button type="button" class="btn btn-outline-secondary" onclick="addDraftSkillFrom('${id}Input')"><i class="bi bi-plus-lg"></i></button>
    </div>
  </div>`;
}
function addDraftSkillFrom(inputId){
  const el=document.getElementById(inputId);
  const v=el.value.trim();
  if(v && !state.draftSkills.some(s=>s.toLowerCase()===v.toLowerCase())){ state.draftSkills.push(v); }
  el.value='';
  rerenderTagBoxes();
}
function removeDraftSkill(i){ state.draftSkills.splice(i,1); rerenderTagBoxes(); }
function rerenderTagBoxes(){
  document.querySelectorAll('[data-tagbox]').forEach(box=>{
    box.outerHTML = tagInputHtml(box.dataset.tagbox, state.draftSkills).replace('<div class="tag-input-box">','<div class="tag-input-box" data-tagbox="'+box.dataset.tagbox+'">');
  });
}

function attachAuthEvents(){
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.authRole=b.dataset.role;state.draftSkills=[];render();});
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.authMode=b.dataset.mode;state.draftSkills=[];render();});
  const lf=document.getElementById('loginForm');
  if(lf) lf.onsubmit=(e)=>{
    e.preventDefault();
    const email=document.getElementById('loginEmail').value.trim().toLowerCase();
    const pw=document.getElementById('loginPassword').value;
    const users=load(K_USERS,[]);
    const u=users.find(x=>x.email.toLowerCase()===email && x.password===pw && x.role===state.authRole);
    if(!u){toast('Invalid credentials for this role.','danger');return;}
    setSession(u); state.view='dashboard'; state.tab=state.authRole==='candidate'?'browse':'myjobs'; render();
    toast(`Welcome back, ${u.name.split(' ')[0]}!`);
  };
  const sf=document.getElementById('signupForm');
  if(sf) sf.onsubmit=(e)=>{
    e.preventDefault();
    const users=load(K_USERS,[]);
    const email=document.getElementById('suEmail').value.trim().toLowerCase();
    if(users.some(x=>x.email.toLowerCase()===email)){toast('An account with this email already exists.','danger');return;}
    const nu={id:uid(),role:state.authRole,name:document.getElementById('suName').value.trim(),
      email,password:document.getElementById('suPassword').value};
    if(state.authRole==='poster'){nu.company=document.getElementById('suCompany').value.trim();}
    else {nu.skills=[...state.draftSkills]; nu.bio='';}
    users.push(nu); save(K_USERS,users); setSession(nu);
    state.view='dashboard'; state.tab=state.authRole==='candidate'?'browse':'postjob'; state.draftSkills=[];
    render(); toast('Account created — welcome to SkillPulse!');
  };
}

/* ============================= SHELL ============================= */
function renderShell(u){
  const isCand=u.role==='candidate';
  const tabs = isCand
    ? [['browse','Browse Jobs','bi-search'],['applications','My Applications','bi-clipboard-check'],['profile','My Profile','bi-person']]
    : [['postjob','Post a Job','bi-plus-circle'],['myjobs','My Jobs','bi-briefcase'],['applicants','Applicants','bi-people'],['profile','My Profile','bi-person']];
  return `
  <nav class="navbar navbar-expand-lg navbar-sp navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand brand" href="#">Skill<span class="pulse-dot">Pulse</span></a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navc"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navc">
        <ul class="navbar-nav me-auto ms-lg-4 gap-lg-3">
          ${tabs.map(([id,label,icon])=>`<li class="nav-item"><a class="nav-link ${state.tab===id?'active':''}" href="#" data-tab="${id}"><i class="bi ${icon} me-1"></i>${label}</a></li>`).join('')}

/* ============================= CANDIDATE VIEWS ============================= */
function renderCandidateTab(u){
  if(state.tab==='browse') return renderBrowseJobs(u);
  if(state.tab==='applications') return renderMyApplications(u);
  if(state.tab==='profile') return renderCandidateProfile(u);

function renderBrowseJobs(u){
  const jobs=load(K_JOBS,[]);
  const allSkills=[...new Set(jobs.flatMap(j=>j.skillsRequired))].sort();
  const filtered=jobs.filter(j=>{
    const s=state.search.toLowerCase();
    const matchSearch=!s || j.title.toLowerCase().includes(s) || j.company.toLowerCase().includes(s) || j.location.toLowerCase().includes(s);
    const matchType=!state.filterType || j.type===state.filterType;
    const matchSkill=!state.filterSkill || j.skillsRequired.includes(state.filterSkill);
    return matchSearch && matchType && matchSkill;
  }).sort((a,b)=>b.postedDate-a.postedDate);

  const apps=load(K_APPS,[]).filter(a=>a.candidateId===u.id);
  const recommended=[...jobs].map(j=>({job:j,m:fallbackMatch(u.skills,j)})).sort((a,b)=>b.m.matchScore-a.m.matchScore).slice(0,3);

  return `
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

    <div class="text-muted-2 small fw-semibold mb-2"><i class="bi bi-stars me-1 text-warning"></i>Recommended for you</div>
    <div class="row g-3">
      ${recommended.map(r=>`
        <div class="col-md-4">
          <div class="card-sp p-3 h-100" style="cursor:pointer" onclick="openJobModal('${r.job.id}')">
            <div class="d-flex justify-content-between align-items-start">
              <div><div class="fw-bold">${r.job.title}</div><div class="text-muted-2 small">${r.job.company}</div></div>
              ${gaugeHtml(r.m.matchScore,'sm')}
            </div>
          </div>
        </div>`).join('')}
    </div>
  </div>

  <div class="card-sp p-3 mb-3">
    <div class="row g-2">
      <div class="col-md-5"><input class="form-control" id="searchInput" placeholder="Search title, company, location..." value="${state.search}"></div>
      <div class="col-md-3"><select class="form-select" id="typeFilter"><option value="">All job types</option>
        ${['Full-time','Part-time','Contract','Internship'].map(t=>`<option ${state.filterType===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="col-md-4"><select class="form-select" id="skillFilter"><option value="">All skills</option>
        ${allSkills.map(s=>`<option ${state.filterSkill===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
  </div>

  <div class="row g-3">
    ${filtered.length? filtered.map(j=>{
      const applied=apps.find(a=>a.jobId===j.id);
      return `<div class="col-md-6">
        <div class="card-sp p-3 h-100 job-card">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="fw-bold fs-6">${j.title}</div>
              <div class="text-muted-2 small">${j.company} · ${j.location}</div>
            </div>
            <span class="badge job-type-badge text-bg-light border">${j.type}</span>
          </div>
          <div class="mt-2">${j.skillsRequired.slice(0,4).map(s=>`<span class="skill-chip outline">${s}</span>`).join('')}${j.skillsRequired.length>4?`<span class="skill-chip outline">+${j.skillsRequired.length-4}</span>`:''}</div>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="text-muted-2 small">${j.salary||''}</span>
            ${applied?`<span class="status-badge status-${applied.status}">${applied.status}</span>`:`<button class="btn btn-sm btn-teal" onclick="openJobModal('${j.id}')">View & Match</button>`}

    }).join('') : `<div class="empty-state w-100"><i class="bi bi-inbox fs-1"></i><div class="mt-2">No jobs match your filters.</div></div>`}

/* ============================= EVENTS PER TAB ============================= */
function attachTabEvents(u){
  document.querySelectorAll('[data-tagbox]').forEach(box=>{
    const id=box.dataset.tagbox;
    // ensure input listens for Enter
  });
  document.querySelectorAll('.tag-input-box input').forEach(inp=>{
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addDraftSkillFrom(inp.id); }});
  });

  if(state.tab==='browse'){
    const si=document.getElementById('searchInput'); if(si) si.oninput=()=>{state.search=si.value;render();};
    const tf=document.getElementById('typeFilter'); if(tf) tf.onchange=()=>{state.filterType=tf.value;render();};
    const sf=document.getElementById('skillFilter'); if(sf) sf.onchange=()=>{state.filterSkill=sf.value;render();};
  }
  if(state.tab==='profile' && u.role==='candidate'){
    const pf=document.getElementById('profileForm');
    if(pf) pf.onsubmit=(e)=>{
      e.preventDefault();
      const users=load(K_USERS,[]); const idx=users.findIndex(x=>x.id===u.id);
      users[idx].name=document.getElementById('profName').value.trim();
      users[idx].bio=document.getElementById('profBio').value.trim();
      users[idx].skills=[...state.draftSkills];
      save(K_USERS,users); toast('Profile updated.'); render();
    };
    const gb=document.getElementById('saveGroqBtn');
    if(gb) gb.onclick=()=>{ const v=document.getElementById('groqKeyInput').value.trim();
      if(v) localStorage.setItem(K_GROQ,v); else localStorage.removeItem(K_GROQ);
      toast('Groq API key saved.'); };
  }
  if(state.tab==='profile' && u.role==='poster'){
    const pf=document.getElementById('posterProfileForm');
    if(pf) pf.onsubmit=(e)=>{
      e.preventDefault();
      const users=load(K_USERS,[]); const idx=users.findIndex(x=>x.id===u.id);
      users[idx].name=document.getElementById('pName').value.trim();
      users[idx].company=document.getElementById('pCompany').value.trim();
      save(K_USERS,users); toast('Profile updated.'); render();
    };
    const gb=document.getElementById('saveGroqBtnP');
    if(gb) gb.onclick=()=>{ const v=document.getElementById('groqKeyInputP').value.trim();
      if(v) localStorage.setItem(K_GROQ,v); else localStorage.removeItem(K_GROQ);
      toast('Groq API key saved.'); };
  }
  if(state.tab==='postjob'){
    const jf=document.getElementById('jobForm');
    if(jf) jf.onsubmit=(e)=>{
      e.preventDefault();
      const jobs=load(K_JOBS,[]);
      const payload={title:document.getElementById('jTitle').value.trim(),
        location:document.getElementById('jLocation').value.trim(),
        type:document.getElementById('jType').value,
        salary:document.getElementById('jSalary').value.trim(),
        description:document.getElementById('jDesc').value.trim(),
        skillsRequired:[...state.draftSkills]};
      if(state.editingJobId){
        const idx=jobs.findIndex(j=>j.id===state.editingJobId);
        jobs[idx]={...jobs[idx],...payload};
        toast('Job updated.');
      } else {
        jobs.push({id:uid(),posterId:u.id,company:u.company,postedDate:Date.now(),...payload});
        toast('Job published!');
      }
      save(K_JOBS,jobs); state.editingJobId=null; state.draftSkills=[]; state.tab='myjobs'; render();
    };
    const cb=document.getElementById('cancelEditBtn');
    if(cb) cb.onclick=()=>{state.editingJobId=null;state.draftSkills=[];state.tab='myjobs';render();};
  }
  if(state.tab==='applicants'){
    const sel=document.getElementById('jobFilterSelect');
    if(sel) sel.onchange=()=>{state.activeJobForApplicants=sel.value||null;render();};
  }
}

/* job actions */
function editJob(id){ state.editingJobId=id; state.draftSkills=[]; state.tab='postjob'; render(); }
function deleteJob(id){
  if(!confirm('Delete this job posting? This cannot be undone.')) return;
  save(K_JOBS, load(K_JOBS,[]).filter(j=>j.id!==id));
  save(K_APPS, load(K_APPS,[]).filter(a=>a.jobId!==id));
  toast('Job deleted.'); render();
}
function viewApplicantsFor(jobId){ state.activeJobForApplicants=jobId; state.tab='applicants'; render(); }
function updateAppStatus(appId,status){
  const apps=load(K_APPS,[]); const idx=apps.findIndex(a=>a.id===appId);
  apps[idx].status=status; save(K_APPS,apps); toast('Application status updated.'); render();
}
async function reAnalyze(appId){
  const apps=load(K_APPS,[]); const idx=apps.findIndex(a=>a.id===appId);
  const app=apps[idx]; const job=load(K_JOBS,[]).find(j=>j.id===app.jobId);
  const cand=load(K_USERS,[]).find(u=>u.id===app.candidateId);
  toast('Running AI analysis...');
  const result=await aiMatch(cand.skills||[],job);
  apps[idx]={...app,...result}; save(K_APPS,apps); render();
  toast(result.source==='ai'?'AI insight updated.':'Updated using local match (no/failed API key).');
}

/* ============================= JOB MODAL ============================= */
function openJobModal(jobId){
  const job=load(K_JOBS,[]).find(j=>j.id===jobId); if(!job) return;
  const u=currentUser();
  const apps=load(K_APPS,[]);
  const existingApp = u && u.role==='candidate' ? apps.find(a=>a.jobId===jobId && a.candidateId===u.id) : null;
  const initialMatch = u && u.role==='candidate' ? (existingApp || fallbackMatch(u.skills||[],job)) : null;

  document.getElementById('jobModalContent').innerHTML = `
    <div class="modal-header">
      <div>
        <h5 class="modal-title fw-bold">${job.title}</h5>
        <div class="text-muted-2 small">${job.company} · ${job.location} · ${job.type} ${job.salary?('· '+job.salary):''}</div>
      </div>
      <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <p>${job.description}</p>
      <div class="mb-3"><div class="fw-semibold small mb-1">Required skills</div>
        ${job.skillsRequired.map(s=>`<span class="skill-chip outline">${s}</span>`).join('')}</div>
      ${u && u.role==='candidate' ? `
      <hr>
      <div id="matchArea">${matchAreaHtml(initialMatch,job)}</div>
      ` : `<div class="text-muted-2 small"><i class="bi bi-info-circle me-1"></i>Log in as a candidate to see your AI match score.</div>`}
    </div>
    <div class="modal-footer">
      ${u && u.role==='candidate' ? (existingApp
        ? `<span class="status-badge status-${existingApp.status}">${existingApp.status}</span>`
        : `<button class="btn btn-teal fw-semibold" id="applyBtn">Apply Now</button>`) : ''}
      <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
    </div>`;
  const modal=new bootstrap.Modal(document.getElementById('jobModal'));
  modal.show();

  if(u && u.role==='candidate'){
    const analyzeBtn=document.getElementById('analyzeBtn');
    if(analyzeBtn) analyzeBtn.onclick=async()=>{
      analyzeBtn.disabled=true; analyzeBtn.innerHTML='<i class="bi bi-arrow-repeat spin me-1"></i>Analyzing...';
      const result=await aiMatch(u.skills||[],job);
      document.getElementById('matchArea').innerHTML = matchAreaHtml(result,job);
      if(existingApp){
        const apps2=load(K_APPS,[]); const idx=apps2.findIndex(a=>a.id===existingApp.id);
        apps2[idx]={...apps2[idx],...result}; save(K_APPS,apps2);
      }
      rebindApplyAndAnalyze(job,u);
    };
    const applyBtn=document.getElementById('applyBtn');
    if(applyBtn) applyBtn.onclick=()=>applyToJob(job,u,modal);
  }
}
function matchAreaHtml(m,job){
  return `
  <div class="d-flex align-items-center gap-3 flex-wrap">
    ${gaugeHtml(m.matchScore)}
    <div class="flex-grow-1">
      <div class="fw-semibold mb-1">Skill-gap analysis <span class="ai-badge ms-1">${m.source==='ai'?'Groq AI':'Quick match'}</span></div>
      <div>${(m.matchingSkills||[]).map(s=>`<span class="skill-chip match"><i class="bi bi-check-circle-fill me-1"></i>${s}</span>`).join('')}
      ${(m.missingSkills||[]).map(s=>`<span class="skill-chip gap"><i class="bi bi-exclamation-circle me-1"></i>${s}</span>`).join('')}</div>
      <div class="text-muted-2 small mt-2">${m.recommendation||''}</div>
    </div>
  </div>
  <button class="btn btn-sm btn-outline-secondary mt-3" id="analyzeBtn"><i class="bi bi-magic me-1"></i>Get AI-Powered Analysis</button>`;
}
function rebindApplyAndAnalyze(job,u){
  const analyzeBtn=document.getElementById('analyzeBtn');
  if(analyzeBtn) analyzeBtn.onclick=async()=>{
    analyzeBtn.disabled=true; analyzeBtn.innerHTML='<i class="bi bi-arrow-repeat spin me-1"></i>Analyzing...';
    const result=await aiMatch(u.skills||[],job);
    document.getElementById('matchArea').innerHTML = matchAreaHtml(result,job);
    const apps2=load(K_APPS,[]); const idx=apps2.findIndex(a=>a.jobId===job.id && a.candidateId===u.id);
    if(idx>-1){apps2[idx]={...apps2[idx],...result}; save(K_APPS,apps2);}
    rebindApplyAndAnalyze(job,u);
  };
}
function applyToJob(job,u,modal){
  const apps=load(K_APPS,[]);
  if(apps.some(a=>a.jobId===job.id && a.candidateId===u.id)){ toast('You already applied to this job.','danger'); return; }
  const m=fallbackMatch(u.skills||[],job);
  apps.push({id:uid(),jobId:job.id,candidateId:u.id,status:'Applied',appliedDate:Date.now(),...m});
  save(K_APPS,apps);
  toast('Application submitted!');
  modal.hide();
  render();
}

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
